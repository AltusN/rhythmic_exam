[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythmic-scoring"
version = "0.0.1"
description = "scoring sytem for rhythmic exams for judges"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest >= 9.1"
]

[tool.setuptools]
packages = ["scoring"]