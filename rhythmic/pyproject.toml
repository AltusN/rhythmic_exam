[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythmic-scoring"
version = "0.0.1"
description = "Marks rhythmic-gymnastics judge exams into percentages and grades using supplied tables, framework-free."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest >= 9.1",
    "pytest-cov >= 7.1",
    "pytest-django >= 4.13",
    "ruff >= 0.16.0",
    "djhtml >= 3.0"
]
web = [
    "django >= 6.1",
    "psycopg[binary] >= 3.3",
    "python-dotenv >= 1.2",
    "pillow >= 12.3",
    "django-simple-history >= 3.13"
]

[tool.ruff]
line-length = 88
# `*.md` mirrors the root ruff.toml. Ruff resolves the nearest config per file, so
# nothing under rhythmic/ ever sees the root guard -- and `ruff format` reformats
# Python code blocks INSIDE markdown, which is how a plan's `    "questions",` became
# `("questions",)` on 2026-08-25. There is markdown under rhythmic/ now.
extend-exclude = [
    "build/",
    "*.md"
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort (import sorting)
  "C4",    # flake8-comprehensions
  "B",     # flake8-bugbear
  "TID",   # flake8-tidy-imports
  "RET",   # return shape
  "BLE",   # blind except
  "UP",    # Keeps syntax current
  "SIM",   # simplify if else
]
ignore = [
  "E501",  # line-too-long (handled by formatter)
]

[tool.setuptools]
packages = ["scoring"]

