[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rhythmic-scoring"
version = "0.0.1"
description = "Marks rhythmic-gymnastics judge exams into percentages and grades using supplied tables, framework-free."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest >= 9.1",
    "pytest-cov >= 7.1",
    "ruff >= 0.16.0"
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "build/"
]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort (import sorting)
  "C4",    # flake8-comprehensions
  "B",     # flake8-bugbear
  "TID",   # flake8-tidy-imports
  "RET",   # return shape
  "BLE",   # blind except
  "UP",    # Keeps syntax current
  "SIM",   # simplify if else
]
ignore = [
  "E501",  # line-too-long (handled by formatter)
]

# Sub-tables must stay last: a TOML table header claims every key below it
# until the next header, so any bare key here would leave [tool.ruff.lint].
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django".msg = "scoring/ is framework-free; if a module needs Django, the boundary is wrong"
"sqlalchemy".msg = "scoring/ touches no database; marking tables arrive as arguments"
"flask".msg = "Flask lives in legacy/ only; new code imports no web framework"

[tool.setuptools]
packages = ["scoring"]